    const SmartImage = ({ src, fallback, alt, className }) => {
      const [imgSrc, setImgSrc] = React.useState(src);
      const [hasError, setHasError] = React.useState(false);
      const handleError = () => {
        if (!hasError) {
          setImgSrc(fallback);
          setHasError(true);
        }
      };
      return <img src={imgSrc} onError={handleError} alt={alt} className={className} loading="lazy" />;
    };

    const CustomAlert = ({ message, type = 'success', onClose }) => {
      React.useEffect(() => {
        const timer = setTimeout(() => { onClose(); }, 4000);
        return () => clearTimeout(timer);
      }, [onClose]);
      return (
        <div className={`fixed top-6 right-6 z-50 flex items-center p-4 rounded-xl shadow-2xl border-l-4 max-w-sm ${type === 'success' ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-amber-50 border-amber-500 text-amber-800'}`}>
          <div className="mr-3">
            {type === 'success' ? (
              <div className="bg-emerald-500 text-white rounded-full p-1"><Check size={16} /></div>
            ) : (
              <div className="bg-amber-500 text-white rounded-full p-1"><Info size={16} /></div>
            )}
          </div>
          <div className="flex-1 font-medium text-xs md:text-sm">{message}</div>
          <button onClick={onClose} className="ml-4 text-gray-400 hover:text-gray-600"><X size={16} /></button>
        </div>
      );
    };

      const [cartOpen, setCartOpen] = React.useState(false);
      const [selectedCategory, setSelectedCategory] = React.useState('All');

      const [cateringForm, setCateringForm] = React.useState({ name: '', email: '', phone: '', eventDate: '', guestCount: '25-50 guests', eventType: 'Corporate Event', notes: '' });
      const [cateringSubmitted, setCateringSubmitted] = React.useState(false);

      React.useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setMobileMenuOpen(false);
      }, [activeTab]);

      const triggerAlert = (message, type = 'success') => { setAlert({ message, type }); };

      const addToCart = (item) => {
        const existing = cart.find(cartItem => cartItem.id === item.id);
        if (existing) {
          setCart(cart.map(cartItem => cartItem.id === item.id ? { ...cartItem, quantity: cartItem.quantity + 1 } : cartItem));
        } else {
          setCart([...cart, { ...item, quantity: 1 }]);
        }
        triggerAlert(`"${item.name}" has been added to your order list!`);
      };

      const updateQuantity = (id, change) => {
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + change;
            return newQty > 0 ? { ...item, quantity: newQty } : item;
          }
          return item;
        }).filter(item => item.quantity > 0));
      };

      const removeFromCart = (id, name) => {
        setCart(cart.filter(item => item.id !== id));
        triggerAlert(`"${name}" has been removed.`, 'info');
      };

      const getCartTotal = () => cart.reduce((total, item) => total + (item.price * item.quantity), 0);
      const getCartCount = () => cart.reduce((total, item) => total + item.quantity, 0);

      const handleCheckout = (e) => {
        e.preventDefault();
        triggerAlert("Your order has been sent to Tito's Kitchen! We will call you shortly.");
        setCart([]);
        setCartOpen(false);
      };

        const { name, value } = e.target;
        setCateringForm({ ...cateringForm, [name]: value });
      };

        setCateringSubmitted(true);
        triggerAlert("Your inquiry has been received! We will contact you within 24 hours.");

                <span className="block text-[11px] leading-tight uppercase tracking-widest text-yellow-300 font-sans">Tito's</span>

          {cartOpen && (
            <div className="fixed inset-0 bg-stone-950/70 backdrop-blur-sm z-50 flex justify-end transition-opacity duration-300">
              <div className="bg-[#FDFBF7] w-full max-w-md h-full flex flex-col justify-between shadow-2xl relative border-l border-stone-200">
                <div className="p-6 border-b border-stone-200 flex items-center justify-between bg-[#C1272D] text-white">
                  <div className="flex items-center gap-2"><ShoppingBag size={20} /><h3 className="font-serif font-black text-lg">Your Order</h3><span className="bg-white/20 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">{getCartCount()} Items</span></div>
                  <button onClick={() => setCartOpen(false)} className="text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-1.5 rounded-lg"><X size={20} /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-20 space-y-4 text-stone-500">
                      <ShoppingBag size={48} className="mx-auto text-stone-300 animate-bounce" /><p className="font-semibold text-stone-700">Your Cart is Empty</p><p className="text-xs max-w-xs mx-auto">Explore our delicious menu items and add them to your cart to begin an online order!</p>
                      <button onClick={() => { setCartOpen(false); setActiveTab('menu'); }} className="bg-[#C1272D] text-white font-bold px-4 py-2 rounded-xl text-xs uppercase shadow-md">View Our Menu</button>
                    </div>
                  ) : (
                    cart.map((item) => (
                      <div key={item.id} className="flex items-center justify-between gap-4 p-4 bg-white rounded-xl border border-stone-200 shadow-sm">
                        <div className="w-16 h-12 bg-stone-100 rounded-lg overflow-hidden shrink-0"><SmartImage src={item.imageSrc} fallback={item.fallbackSrc} alt={item.name} className="w-full h-full object-cover" /></div>
                        <div className="flex-1 min-w-0"><h4 className="font-serif font-bold text-stone-900 text-sm truncate">{item.name}</h4><p className="text-[#C1272D] font-black text-sm">${item.price}</p></div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateQuantity(item.id, -1)} className="bg-stone-100 hover:bg-stone-200 text-stone-800 p-1 rounded-md"><Minus size={12} /></button>
                          <span className="font-bold text-xs w-4 text-center">{item.quantity}</span>
                          <button onClick={() => updateQuantity(item.id, 1)} className="bg-stone-100 hover:bg-stone-200 text-stone-800 p-1 rounded-md"><Plus size={12} /></button>
                        </div>
                        <button onClick={() => removeFromCart(item.id, item.name)} className="text-stone-400 hover:text-[#C1272D] p-1 rounded"><Trash2 size={16} /></button>
                      </div>
                    ))
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="p-6 border-t border-stone-200 bg-stone-50 space-y-4">
                    <div className="space-y-2 text-sm text-stone-600">
                      <div className="flex justify-between"><span>Subtotal</span><span className="font-bold text-stone-800">${getCartTotal().toFixed(2)}</span></div>
                      <div className="flex justify-between"><span>VA Sales Tax (10%)</span><span className="font-bold text-stone-800">${(getCartTotal() * 0.1).toFixed(2)}</span></div>
                      <div className="flex justify-between border-t border-stone-200 pt-3 text-base text-stone-900 font-extrabold font-serif"><span>Total Price</span><span className="text-[#C1272D]">${(getCartTotal() * 1.1).toFixed(2)}</span></div>
                    </div>
                    <button onClick={handleCheckout} className="w-full bg-[#C1272D] hover:bg-[#A31F24] text-white font-bold py-4 rounded-xl shadow-lg text-xs uppercase tracking-wider text-center">Send Order to Kitchen</button>
                    <p className="text-[10px] text-center text-stone-400">*Once submitted, our cashier desk will telephone you to validate payment and pick-up details.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-[#FDFBF7]/95 backdrop-blur-md border-t border-stone-200 px-4 py-3 z-30 flex items-center justify-around gap-2 shadow-2xl">
            <a href="tel:7032731570" className="flex-1 flex flex-col items-center justify-center text-stone-600 hover:text-[#C1272D]"><Phone size={18} /><span className="text-[10px] font-bold mt-1 uppercase">Call Us</span></a>
            <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" className="flex-1 flex flex-col items-center justify-center text-stone-600 hover:text-[#C1272D]"><MapPin size={18} /><span className="text-[10px] font-bold mt-1 uppercase">Directions</span></a>
            <button onClick={() => setActiveTab('menu')} className="flex-1.5 flex items-center justify-center gap-1.5 bg-[#C1272D] text-white font-black text-xs px-4 py-2.5 rounded-xl shadow uppercase"><ShoppingBag size={14} /> Order Menu</button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
